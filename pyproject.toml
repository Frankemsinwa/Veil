[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-gateway"
version = "0.1.0"
description = "Enterprise-Grade Local AI Privacy Gateway"
authors = [{ name = "Veil Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pywebview>=5.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.scripts]
veil = "app.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

