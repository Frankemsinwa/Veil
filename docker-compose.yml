services:
  veil:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veil-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - VEIL_HOST=0.0.0.0
      - VEIL_PORT=8080
      - VEIL_POLICY=STRICT
      - VEIL_FAIL_CLOSED=true
      - VEIL_UPSTREAM_OPENAI_BASE_URL=https://api.openai.com/v1
    volumes:
      - veil-audit-data:/home/veiluser/.veil
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  veil-audit-data:
